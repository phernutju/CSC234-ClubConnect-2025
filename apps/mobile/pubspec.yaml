name: csc234_clubconnect
description: "ClubConnect — best space to connect with people."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Declarative routing with named routes and shell support
  go_router: ^14.6.3
  # Serif & display fonts for headings and italic accents
  google_fonts: ^6.2.1
  # Image picker for gallery/camera access in chat
  image_picker: ^1.1.0
  # In-memory state management (no DB yet)
  provider: ^6.1.2
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
