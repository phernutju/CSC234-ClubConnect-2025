name: csc234_clubconnect
description: "ClubConnect — best space to connect with people."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.4.10
  firebase_crashlytics: ^4.0.0
  provider: ^6.1.2
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  image_picker: ^1.2.2
  google_sign_in: ^6.2.2
  flutter_svg: ^2.0.0
  http: ^1.2.0
  image: ^4.2.0
  intl: ^0.19.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
